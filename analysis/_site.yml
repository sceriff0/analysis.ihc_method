name: ihc_method
output_dir: ../docs
# One navbar entry per part of the study, in the order the study is read. A part with
# more than one page becomes a dropdown, so the top bar always has the same six items
# no matter how many pages sit under them. Page order inside a menu is reading order,
# not alphabetical.
navbar:
  title: ihc_method
  left:
  - text: Home
    href: index.html
  - text: Paper figures
    href: paper_figures.html
  - text: 1 · Clinical
    menu:
    # One page per phenotyping arm, in arm order. They are identical in
    # construction — same child body — and differ only in which arm they read.
    - text: Massimo1 — selected regions
      href: clinical_massimo1.html
    - text: Massimo2 — all-slide export
      href: clinical_massimo2.html
    - text: Massimo1 inverted — modified PANCK
      href: clinical_massimo1_inverted.html
    - text: '---'
    - text: Annotation membership QC
      href: clinical_membership_qc.html
  - text: 2 · Molecular
    menu:
    - text: Massimo1 — selected regions
      href: molecular_massimo1.html
    - text: Massimo2 — all-slide export
      href: molecular_massimo2.html
    - text: Massimo1 inverted — modified PANCK
      href: molecular_massimo1_inverted.html
  - text: 3 · Registration
    menu:
    - text: Run QC — the study samples
      href: registration_run_qc.html
    - text: Registration arms — choosing a configuration
      href: registration_arms.html
  - text: 4 · Benchmarks
    menu:
    - text: Registration accuracy — synthetic sweep
      href: benchmark_registration.html
    - text: Pipeline benchmarks — resource, cost, segmentation
      href: benchmark_pipeline.html
  - text: Marker QC
    href: marker_qc.html
  right:
  - text: About
    menu:
    - text: About
      href: about.html
    - text: License
      href: license.html
  - icon: fab fa-github
    text: Source code
    href: https://github.com/sceriff0/ihc_method
output:
  workflowr::wflow_html:
    toc: yes
    toc_float: yes
    theme: cosmo
    highlight: textmate
